name: Deploy to T480 Edge Node

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}-api:latest

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.T480_HOST }}
          port: ${{ secrets.T480_PORT }}
          username: ${{ secrets.T480_USER }}
          key: ${{ secrets.T480_SSH_KEY }}
          proxy_host: ${{ secrets.PROXY_HOST }}
          proxy_username: ${{ secrets.PROXY_USER }}
          proxy_key: ${{ secrets.PROXY_SSH_KEY }}
          source: "docker-compose.yml,config/init-dbs.sql"
          target: "~/sl-metro-predict"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.T480_HOST }}
          port: ${{ secrets.T480_PORT }}
          username: ${{ secrets.T480_USER }}
          key: ${{ secrets.T480_SSH_KEY }}
          proxy_host: ${{ secrets.PROXY_HOST }}
          proxy_username: ${{ secrets.PROXY_USER }}
          proxy_key: ${{ secrets.PROXY_SSH_KEY }}
          script: |
            # Log in to the Container Registry on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Navigate to project directory
            mkdir -p ~/sl-metro-predict
            cd ~/sl-metro-predict
            
            # Restart docker-compose services (using the copied docker-compose.yml)
            docker-compose up -d
            
            # Pull the newly built API image
            docker pull ghcr.io/${{ env.REPO_LC }}-api:latest
            
            # Stop existing API container if running
            docker stop sl-metro-api-container || true
            docker rm sl-metro-api-container || true
            
            # Run the new FastAPI app container
            # The model is baked into the Docker image, so we do not mount an empty host volume.
            docker run -d --name sl-metro-api-container \
              -p 8000:8000 \
              ghcr.io/${{ env.REPO_LC }}-api:latest
